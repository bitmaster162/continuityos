name: P0 Unified Shadow Continuity

on:
  push:
    branches:
      - agent/p0-unified-shadow-continuity-r1
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  offline-shadow-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile P0 continuity adapters
        run: |
          python -m py_compile continuityos/unified_shadow_continuity.py continuityos/shadow_replay_history.py tests/test_unified_shadow_continuity.py tests/test_shadow_replay_history.py
      - name: Run P0 continuity and replay-history tests
        run: |
          python -m unittest tests.test_unified_shadow_continuity tests.test_shadow_replay_history -v
