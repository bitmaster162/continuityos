name: r13-postpass-apply-once

on:
  push:
    branches:
      - agent/sct-r13-postpass-case001-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sct-r13-postpass-case001-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact post-pass code hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) CLI receipts: emit the exact core receipt already hash-bound in EvidenceStore.
          replace_once(
              'sct/r13_cli.py',
              '''        lifecycle = finish_r13_component_attempt(store, component=component, receipt=out)\n        return _emit(\n            {**out, "attempt_lifecycle": lifecycle},\n            0 if out.get(pass_field) is True else 2,\n        )''',
              '''        finish_r13_component_attempt(store, component=component, receipt=out)\n        return _emit(\n            out,\n            0 if out.get(pass_field) is True else 2,\n        )''',
          )

          replace_once(
              'sct/r13_cli.py',
              'from .bench.arena import ProspectiveArena\nfrom .bench.envelope import BASELINES, build_standard_inputs\n',
              'from .bench.arena import ProspectiveArena\nfrom .bench.envelope import BASELINES, build_standard_inputs\nfrom .baseline_r13 import build_arm_b_profile_rag\n',
          )
          replace_once(
              'sct/r13_cli.py',
              'from .r13_manifest_guard import validate_baseline_for_seal, validate_model_manifest_for_seal\n',
              'from .r13_manifest_guard import validate_baseline_for_seal, validate_model_manifest_for_seal\nfrom .r13_live_provenance import build_arm_b_live_provenance_receipt, canonical_evidence_blob\n',
          )
          replace_once(
              'sct/r13_cli.py',
              '''def _json_file(path: str) -> dict:\n    value = json.loads(Path(path).expanduser().read_text(encoding="utf-8"))\n    if not isinstance(value, dict):\n        raise SctError(f"JSON object required: {path}")\n    return value\n\n\n''',
              '''def _json_file(path: str) -> dict:\n    value = json.loads(Path(path).expanduser().read_text(encoding="utf-8"))\n    if not isinstance(value, dict):\n        raise SctError(f"JSON object required: {path}")\n    return value\n\n\ndef _json_array_file(path: str) -> list[dict]:\n    value = json.loads(Path(path).expanduser().read_text(encoding="utf-8"))\n    if not isinstance(value, list) or not all(isinstance(row, dict) for row in value):\n        raise SctError(f"JSON array of objects required: {path}")\n    return value\n\n\n''',
          )
          replace_once(
              'sct/r13_cli.py',
              '''    op.add_argument("--static-profile-file", required=True)\n    op.add_argument("--permitted-history-file")\n    op.add_argument("--sct-state-file", required=True)''',
              '''    op.add_argument("--arm-b-evidence-file", required=True)\n    op.add_argument("--arm-b-source-cutoff", type=float, required=True)\n    op.add_argument("--arm-b-expected-pool-sha256", required=True)\n    op.add_argument("--sct-state-file", required=True)''',
          )
          replace_once(
              'sct/r13_cli.py',
              '''            inputs = build_standard_inputs(\n                scenario=args.situation,\n                options=args.option,\n                provider=model_id,\n                model=model_id,\n                model_version=model_version,\n                static_profile=_read_text(args.static_profile_file),\n                permitted_history=_read_text(args.permitted_history_file),\n                sct_state=_read_text(args.sct_state_file),\n                token_budget=args.token_budget,\n                temperature=args.temperature,\n                reasoning=args.reasoning,\n                frozen_at=__import__("time").time(),\n            )\n            arena = ProspectiveArena(store)''',
              '''            evidence_rows = _json_array_file(args.arm_b_evidence_file)\n            sct_state = _read_text(args.sct_state_file)\n            target_context_bytes = len(sct_state.encode("utf-8"))\n            builder_output = build_arm_b_profile_rag(\n                scenario=args.situation,\n                options=args.option,\n                evidence_rows=evidence_rows,\n                source_cutoff=args.arm_b_source_cutoff,\n                target_context_bytes=target_context_bytes,\n                expected_admitted_pool_sha256=args.arm_b_expected_pool_sha256,\n            )\n            frozen_at = __import__("time").time()\n            inputs = build_standard_inputs(\n                scenario=args.situation,\n                options=args.option,\n                provider=model_id,\n                model=model_id,\n                model_version=model_version,\n                static_profile=builder_output["static_profile"],\n                permitted_history=builder_output["permitted_history"],\n                sct_state=sct_state,\n                token_budget=args.token_budget,\n                temperature=args.temperature,\n                reasoning=args.reasoning,\n                frozen_at=frozen_at,\n            )\n            baseline_events = list(store.query(kind="R13_BASELINE_SPEC_SEALED"))\n            if not baseline_events:\n                raise SctError("R13 Arm B baseline must be sealed before LIVE provenance")\n            evidence_blob_sha256 = store.put_blob(canonical_evidence_blob(evidence_rows))\n            arm_b_provenance = build_arm_b_live_provenance_receipt(\n                case_id=args.id,\n                scenario=args.situation,\n                options=args.option,\n                evidence_rows=evidence_rows,\n                evidence_blob_sha256=evidence_blob_sha256,\n                source_cutoff=args.arm_b_source_cutoff,\n                target_context_bytes=target_context_bytes,\n                expected_admitted_pool_sha256=args.arm_b_expected_pool_sha256,\n                builder_output=builder_output,\n                profile_rag_snapshot_sha256=inputs["profile_rag"].snapshot_sha256,\n                baseline_manifest_sha256=baseline_events[-1].payload["baseline_manifest_sha256"],\n            )\n            store.append("R13_ARM_B_LIVE_PROVENANCE_VERIFIED", arm_b_provenance)\n            arena = ProspectiveArena(store)''',
          )
          replace_once(
              'sct/r13_cli.py',
              '''                assistant_influence=args.assistant_influence,\n            )''',
              '''                assistant_influence=args.assistant_influence,\n                frozen_at=frozen_at,\n            )''',
          )
          replace_once(
              'sct/r13_cli.py',
              '''                    "mapping": mapping,\n                    "request_hashes": {arm: sha256_obj(requests[arm]) for arm in BASELINES},''',
              '''                    "mapping": mapping,\n                    "arm_b_provenance": arm_b_provenance,\n                    "request_hashes": {arm: sha256_obj(requests[arm]) for arm in BASELINES},''',
          )

          # 2) Store-level fail-closed enforcement: provenance must exist before CASE_FROZEN,
          # and the frozen profile_rag contestant input must match the builder-verified receipt.
          sqlite_path = Path('sct/store/sqlite.py')
          sqlite = sqlite_path.read_text(encoding='utf-8')
          marker = '    def _require_r13_case_open_admission_if_active(self) -> None:\n'
          if sqlite.count(marker) != 1:
              raise SystemExit('sqlite.py: case admission marker mismatch')
          methods = '''    def _r13_is_active(self) -> bool:\n        return self._conn.execute(\n            "SELECT 1 FROM event WHERE kind='R13_PRECASE_PROTOCOL_AMENDED' ORDER BY seq DESC LIMIT 1"\n        ).fetchone() is not None\n\n    def _require_r13_arm_b_live_provenance_append(self, payload: Mapping[str, Any]) -> None:\n        if not self._r13_is_active():\n            return\n        case_id = payload.get("case_id")\n        if not isinstance(case_id, str) or not case_id.strip():\n            raise EvidenceError("R13_ARM_B_LIVE_PROVENANCE_BLOCKED: case_id required")\n        if self._conn.execute(\n            "SELECT 1 FROM event WHERE kind='CASE_FROZEN' AND json_extract(payload,'$.case_id')=? LIMIT 1",\n            (case_id,),\n        ).fetchone() is not None:\n            raise EvidenceError("R13_ARM_B_LIVE_PROVENANCE_BLOCKED: provenance must precede CASE_FROZEN")\n        if self._conn.execute(\n            "SELECT 1 FROM event WHERE kind='R13_ARM_B_LIVE_PROVENANCE_VERIFIED' "\n            "AND json_extract(payload,'$.case_id')=? LIMIT 1",\n            (case_id,),\n        ).fetchone() is not None:\n            raise EvidenceError("R13_ARM_B_LIVE_PROVENANCE_BLOCKED: duplicate case provenance")\n        baseline = self._conn.execute(\n            "SELECT payload FROM event WHERE kind='R13_BASELINE_SPEC_SEALED' ORDER BY seq DESC LIMIT 1"\n        ).fetchone()\n        if baseline is None:\n            raise EvidenceError("R13_ARM_B_LIVE_PROVENANCE_BLOCKED: sealed baseline required")\n        blob_sha = payload.get("evidence_blob_sha256")\n        if not isinstance(blob_sha, str):\n            raise EvidenceError("R13_ARM_B_LIVE_PROVENANCE_BLOCKED: evidence blob required")\n        from ..r13_live_provenance import validate_arm_b_live_provenance_receipt\n        validated = validate_arm_b_live_provenance_receipt(\n            payload,\n            evidence_blob=self.get_blob(blob_sha),\n            sealed_baseline=json.loads(baseline["payload"]),\n        )\n        if canonical_json(validated) != canonical_json(dict(payload)):\n            raise EvidenceError("R13_ARM_B_LIVE_PROVENANCE_BLOCKED: non-canonical provenance receipt")\n\n    def _require_r13_profile_rag_input_binding_if_active(self, payload: Mapping[str, Any]) -> None:\n        if not self._r13_is_active() or payload.get("arm") != "profile_rag":\n            return\n        case_id = payload.get("case_id")\n        row = self._conn.execute(\n            "SELECT payload FROM event WHERE kind='R13_ARM_B_LIVE_PROVENANCE_VERIFIED' "\n            "AND json_extract(payload,'$.case_id')=? ORDER BY seq DESC LIMIT 1",\n            (case_id,),\n        ).fetchone()\n        if row is None:\n            raise EvidenceError("R13_ARM_B_LIVE_PROVENANCE_REQUIRED: profile_rag provenance missing")\n        provenance = json.loads(row["payload"])
        builder = provenance.get("builder_output") or {}\n        expected_context = str(builder.get("static_profile") or "") + "\\n" + str(builder.get("permitted_history") or "")\n        if (\n            payload.get("snapshot_sha256") != provenance.get("profile_rag_snapshot_sha256")\n            or payload.get("payload_sha256") != provenance.get("profile_rag_payload_sha256")\n            or payload.get("personal_context") != expected_context\n            or sha256_obj(payload.get("personal_context")) != provenance.get("profile_rag_payload_sha256")\n            or payload.get("execution_authority") != "NONE"\n            or payload.get("can_execute") is not False\n        ):\n            raise EvidenceError("R13_ARM_B_LIVE_PROVENANCE_MISMATCH: frozen profile_rag input differs from verified builder output")\n\n'''
          sqlite = sqlite.replace(marker, methods + '    def _require_r13_case_open_admission_if_active(self, payload: Mapping[str, Any]) -> None:\n', 1)

          old_active = '''        active = self._conn.execute(\n            "SELECT 1 FROM event WHERE kind='R13_PRECASE_PROTOCOL_AMENDED' ORDER BY seq DESC LIMIT 1"\n        ).fetchone()\n        if active is None:\n            return\n'''
          if sqlite.count(old_active) != 1:
              raise SystemExit('sqlite.py: active gate target mismatch')
          sqlite = sqlite.replace(old_active, '''        if not self._r13_is_active():\n            return\n''', 1)

          needle = '''        if not self.verify().ok:\n            raise EvidenceError("R13_PRECASE_ADMISSION_BLOCKED: Evidence Store verification failed")\n\n    def append(self, kind: str, payload: Mapping[str, Any], *, ts: Optional[float] = None) -> EventRecord:\n'''
          if sqlite.count(needle) != 1:
              raise SystemExit('sqlite.py: post-admission target mismatch')
          extra = '''        case_id = payload.get("case_id")\n        snapshots = payload.get("input_snapshot_sha256")\n        provenance_row = self._conn.execute(\n            "SELECT payload FROM event WHERE kind='R13_ARM_B_LIVE_PROVENANCE_VERIFIED' "\n            "AND json_extract(payload,'$.case_id')=? ORDER BY seq DESC LIMIT 1",\n            (case_id,),\n        ).fetchone()\n        if provenance_row is None:\n            raise EvidenceError("R13_ARM_B_LIVE_PROVENANCE_REQUIRED: verified Arm B builder receipt required before CASE_FROZEN")\n        provenance = json.loads(provenance_row["payload"])
        if (\n            not isinstance(snapshots, Mapping)\n            or snapshots.get("profile_rag") != provenance.get("profile_rag_snapshot_sha256")\n            or provenance.get("baseline_manifest_sha256") != b.get("baseline_manifest_sha256")\n            or provenance.get("scenario") != payload.get("situation")\n            or tuple(provenance.get("options") or ()) != tuple(payload.get("options") or ())\n        ):\n            raise EvidenceError("R13_ARM_B_LIVE_PROVENANCE_MISMATCH: CASE_FROZEN is not bound to verified Arm B builder output")\n        if not self.verify().ok:\n            raise EvidenceError("R13_PRECASE_ADMISSION_BLOCKED: Evidence Store verification failed")\n\n    def append(self, kind: str, payload: Mapping[str, Any], *, ts: Optional[float] = None) -> EventRecord:\n'''
          sqlite = sqlite.replace(needle, extra, 1)

          old_dispatch = '''            if clean_kind == "CASE001_ENROLLMENT_AUTHORIZED":\n                self._require_r13_owner_authorization_append(payload_obj)\n            if clean_kind == "CASE_FROZEN":\n                self._require_r13_case_open_admission_if_active()\n'''
          if sqlite.count(old_dispatch) != 1:
              raise SystemExit('sqlite.py: append dispatch target mismatch')
          new_dispatch = '''            if clean_kind == "CASE001_ENROLLMENT_AUTHORIZED":\n                self._require_r13_owner_authorization_append(payload_obj)\n            if clean_kind == "R13_ARM_B_LIVE_PROVENANCE_VERIFIED":\n                self._require_r13_arm_b_live_provenance_append(payload_obj)\n            if clean_kind == "CASE_FROZEN":\n                self._require_r13_case_open_admission_if_active(payload_obj)\n            if clean_kind == "CONTESTANT_INPUT_FROZEN":\n                self._require_r13_profile_rag_input_binding_if_active(payload_obj)\n'''
          sqlite = sqlite.replace(old_dispatch, new_dispatch, 1)
          sqlite_path.write_text(sqlite, encoding='utf-8')

          # Existing bypass test must now stay blocked even after owner authorization.
          replace_once(
              'tests/test_sct_r13_live_wiring.py',
              '''    store, _, _ = _fully_authorized_store(tmp_path)\n    rec = store.append("CASE_FROZEN", {"case_id": "AUTHORIZED-DIRECT"})\n    assert rec.payload["case_id"] == "AUTHORIZED-DIRECT"\n    store.close()''',
              '''    store, _, _ = _fully_authorized_store(tmp_path)\n    with pytest.raises(EvidenceError, match="R13_ARM_B_LIVE_PROVENANCE_REQUIRED"):\n        store.append("CASE_FROZEN", {"case_id": "AUTHORIZED-DIRECT"})\n    assert not list(store.query(kind="CASE_FROZEN"))\n    store.close()''',
          )

          # Add focused post-pass regression tests.
          Path('tests/test_sct_r13_postpass_hardening.py').write_text(r'''import json

import pytest

from sct.baseline_r13 import admitted_pool_sha256, admitted_segments, baseline_policy_hashes, build_arm_b_profile_rag
from sct.bench.arena import ProspectiveArena
from sct.bench.envelope import build_standard_inputs
from sct.canon import sha256_obj
from sct.errors import EvidenceError
from sct.r13_live_provenance import build_arm_b_live_provenance_receipt, canonical_evidence_blob
from sct.store.sqlite import SQLiteEvidenceStore


def _rows():
    return [
        {"segment_id":"p1","source_id":"raw","text":"I prefer reversible evidence-gated experiments.","observed_at":100.0,"profile_eligible":True,"admitted":True,"assistant_authored":False,"sct_only_derived":False,"authorship":"HUMAN_USER"},
        {"segment_id":"h1","source_id":"raw","text":"I compare rollback cost before deployment.","observed_at":110.0,"profile_eligible":False,"admitted":True,"assistant_authored":False,"sct_only_derived":False,"authorship":"HUMAN_USER"},
    ]


def _seed_authority(store):
    baseline = {"baseline_manifest_sha256":"b"*64, "execution_authority":"NONE", **baseline_policy_hashes()}
    store.append("R13_PRECASE_PROTOCOL_AMENDED", {"manifest_sha256":"a"*64})
    store.append("R13_BASELINE_SPEC_SEALED", baseline)
    store.append("R13_QUALIFICATION_PASSED", {
        "qualification_sha256":"c"*64,
        "protocol_manifest_sha256":"a"*64,
        "model_selection_manifest_sha256":"d"*64,
        "baseline_manifest_sha256":"b"*64,
        "preflight_receipt_sha256":"1"*64,
        "sentinel_receipt_sha256":"2"*64,
        "stable_void_receipt_sha256":"3"*64,
        "operator_attestation_sha256":"4"*64,
        "case_001_authorized":False,
        "valid_live_n":0,
        "can_execute":False,
        "execution_authority":"NONE",
    })
    # Direct SQL seed is intentionally not used: store guards are tested elsewhere. This helper
    # cannot create a forged qualification on a real R13 store, so this test uses monkeypatch below.
    return baseline


def test_provenance_receipt_replays_exact_frozen_builder(tmp_path):
    rows = _rows()
    pool = admitted_pool_sha256(admitted_segments(rows, source_cutoff=200.0))
    builder = build_arm_b_profile_rag(
        scenario="Deploy or wait?", options=("deploy","wait"), evidence_rows=rows,
        source_cutoff=200.0, target_context_bytes=512, expected_admitted_pool_sha256=pool,
    )
    inputs = build_standard_inputs(
        scenario="Deploy or wait?", options=("deploy","wait"), provider="m", model="m", model_version="1",
        static_profile=builder["static_profile"], permitted_history=builder["permitted_history"],
        sct_state="S"*512, token_budget=512, temperature=0.0, reasoning="fixed", frozen_at=123.0,
    )
    store = SQLiteEvidenceStore(tmp_path/'p.sqlite')
    blob = canonical_evidence_blob(rows)
    blob_sha = store.put_blob(blob)
    receipt = build_arm_b_live_provenance_receipt(
        case_id="CASE-001", scenario="Deploy or wait?", options=("deploy","wait"), evidence_rows=rows,
        evidence_blob_sha256=blob_sha, source_cutoff=200.0, target_context_bytes=512,
        expected_admitted_pool_sha256=pool, builder_output=builder,
        profile_rag_snapshot_sha256=inputs["profile_rag"].snapshot_sha256,
        baseline_manifest_sha256="b"*64,
    )
    assert receipt["profile_rag_payload_sha256"] == inputs["profile_rag"].payload_sha256
    assert receipt["builder_output_sha256"] == sha256_obj(builder)
    store.close()


def test_r13_cli_source_no_longer_emits_lifecycle_wrapped_component_receipt():
    from pathlib import Path
    text = Path('sct/r13_cli.py').read_text(encoding='utf-8')
    component_block = text[text.index('def _run_component'):text.index('def main')]
    assert '{**out, "attempt_lifecycle": lifecycle}' not in component_block
    assert 'finish_r13_component_attempt(store, component=component, receipt=out)' in component_block
    assert 'return _emit(\n            out,' in component_block


def test_r13_open_case_cli_forbids_caller_supplied_arm_b_text_files():
    from sct.r13_cli import build_parser
    parser = build_parser()
    open_case = next(a for a in parser._actions if getattr(a, 'dest', None) == 'cmd').choices['open-case']
    dests = {a.dest for a in open_case._actions}
    assert 'static_profile_file' not in dests
    assert 'permitted_history_file' not in dests
    assert {'arm_b_evidence_file','arm_b_source_cutoff','arm_b_expected_pool_sha256'} <= dests
''', encoding='utf-8')
          PY

      - name: Run targeted R13 post-pass tests
        shell: bash
        run: |
          python -m pip install -e . pytest
          pytest -q \
            tests/test_sct_r13_hf_local_and_baseline.py \
            tests/test_sct_r13_live_wiring.py \
            tests/test_sct_r13_terminal_attempt.py \
            tests/test_sct_r13_postpass_hardening.py

      - name: Remove one-shot workflow and commit only verified patch
        shell: bash
        run: |
          git rm .github/workflows/r13-postpass-apply-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sct tests
          git diff --cached --check
          git commit -m "fix: harden R13 post-pass case provenance"
          git push origin HEAD:agent/sct-r13-postpass-case001-hardening
