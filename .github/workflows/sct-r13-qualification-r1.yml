name: sct-r13-r1-offline-adjudication

on:
  pull_request:
    branches:
      - agent/sct-r13-precase-qualification

permissions:
  contents: read
  actions: read

concurrency:
  group: sct-r13-r1-offline-adjudication
  cancel-in-progress: false

jobs:
  adjudicate-existing-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: 2b3f0288ee35eb8d6554218694f9111e29147dd2
      SOURCE_TREE: 174c5045af3e43b1be62dfc07335de0ea6ea095e
      ORIGINAL_RUN_ID: '32180659955'
      ORIGINAL_ARTIFACT_ID: '9340970474'
      ORIGINAL_ARTIFACT_NAME: SCT_R13_QUALIFICATION_R1_32180659955
      EXPECTED_ARTIFACT_ZIP_SHA256: 5166752b02fb402aeaedc97ca1f3b8dba11be976d7270297e6b15fc2fabe914e
      MODEL_MANIFEST: sct/protocols/r13_model_selection_qwen25_1_5b_frozen.json
    steps:
      - name: Checkout exact frozen R13 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install source only — no model runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install .
          python - <<'PY'
          import importlib.util
          # This adjudication must not require or load a model runtime.
          from sct.canon import sha256_obj
          print('offline_adjudication_ready', bool(sha256_obj({'ok': True})))
          PY

      - name: Download immutable original R13 R1 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original
          gh run download "$ORIGINAL_RUN_ID" --repo "${{ github.repository }}" --name "$ORIGINAL_ARTIFACT_NAME" --dir original
          test -f original/r13.sqlite
          test -f original/preflight.json
          test -f original/sentinel.json
          test -f original/stable_void.json
          test -f original/SHA256SUMS.json

      - name: Verify original immutable run and strip only CLI lifecycle wrappers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p adjudication
          cp original/r13.sqlite adjudication/r13.sqlite
          python - <<'PY'
          from pathlib import Path
          import json, sqlite3
          from sct.canon import sha256_obj

          src=Path('original')
          out=Path('adjudication')
          expected_components={
              'preflight': ('preflight', 2),
              'sentinel': ('context-sentinel', 18),
              'stable_void': ('stable-void', 30),
          }

          db=sqlite3.connect('file:original/r13.sqlite?mode=ro&immutable=1', uri=True)
          rows=list(db.execute("SELECT payload FROM event WHERE kind='R13_COMPONENT_RECEIPT_RECORDED' ORDER BY seq"))
          assert len(rows)==3
          recorded={}
          for (payload,) in rows:
              p=json.loads(payload)
              recorded[p['component']]=p['receipt_sha256']
              assert p['component_pass'] is True
              assert p['valid_live_n']==0
              assert p['execution_authority']=='NONE'

          audit=[]
          for file_stem,(component,count) in expected_components.items():
              wrapped=json.loads((src/f'{file_stem}.json').read_text())
              lifecycle=wrapped.get('attempt_lifecycle')
              assert isinstance(lifecycle,dict)
              assert lifecycle['component']==component
              assert lifecycle['component_pass'] is True
              assert lifecycle['attempted_calls']==count
              core=dict(wrapped)
              core.pop('attempt_lifecycle',None)
              core_sha=sha256_obj(core)
              assert core_sha==lifecycle['receipt_sha256']
              assert core_sha==recorded[component]
              assert core['attempted_calls']==count
              assert core['automatic_retry'] is False
              assert int(core.get('replacement_cases',0))==0
              assert int(core.get('replacement_models',0))==0
              assert core['valid_live_cases_added']==0
              assert core['execution_authority']=='NONE'
              (out/f'{file_stem}_core.json').write_text(json.dumps(core,indent=2,sort_keys=True),encoding='utf-8')
              audit.append({
                  'component':component,
                  'call_count':count,
                  'wrapped_sha256':sha256_obj(wrapped),
                  'core_receipt_sha256':core_sha,
                  'recorded_receipt_sha256':recorded[component],
                  'only_removed_field':'attempt_lifecycle',
                  'match':True,
              })
          (out/'receipt_normalization_audit.json').write_text(json.dumps(audit,indent=2),encoding='utf-8')
          PY

      - name: Prove all 50 scientific calls already passed and no rerun occurred
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          pre=json.load(open('adjudication/preflight_core.json'))
          sen=json.load(open('adjudication/sentinel_core.json'))
          sta=json.load(open('adjudication/stable_void_core.json'))
          assert pre['deterministic'] is True and pre['attempted_calls']==2
          assert sen['satisfies_context_responsiveness_gate'] is True and sen['attempted_calls']==18
          assert len(sen['relations'])==18
          assert all(r['strict_directional_relation_pass'] for r in sen['relations'])
          assert sta['stable_void_pass'] is True and sta['attempted_calls']==30
          assert sta['valid_live_cases_added']==0
          json.dump({
              'scientific_model_calls_reexecuted':0,
              'existing_calls_adjudicated':50,
              'preflight':'PASS_2_OF_2',
              'sentinel':'PASS_18_OF_18',
              'stable_void':'PASS_30_OF_30',
              'valid_live_n':0,
              'execution_authority':'NONE',
          },open('adjudication/existing_scientific_evidence_summary.json','w'),indent=2)
          PY

      - name: Rebuild content-bound operator attestation from existing core receipts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from sct.canon import sha256_obj
          model=json.load(open('sct/protocols/r13_model_selection_qwen25_1_5b_frozen.json'))
          pre=json.load(open('adjudication/preflight_core.json'))
          sen=json.load(open('adjudication/sentinel_core.json'))
          sta=json.load(open('adjudication/stable_void_core.json'))
          body={
            'schema':'sct.r13-operator-runtime-attestation/v1',
            'source_code_sha':'2b3f0288ee35eb8d6554218694f9111e29147dd2',
            'source_tree_sha':'174c5045af3e43b1be62dfc07335de0ea6ea095e',
            'protocol_manifest_sha256':pre['protocol_manifest_sha256'],
            'model_selection_manifest_sha256':model['manifest_sha256'],
            'model_repo_or_provider_id':model['model_repo_or_provider_id'],
            'model_revision':model['model_revision'],
            'weight_hashes':model['weight_hashes'],
            'tokenizer_hashes':model['tokenizer_hashes'],
            'runtime_backend':model['runtime_backend'],
            'runtime_version':model['runtime_version'],
            'precision_or_quantization':model['precision_or_quantization'],
            'device_class':model['device_class'],
            'deterministic_flags':model['deterministic_flags'],
            'preflight_receipt_sha256':sha256_obj(pre),
            'sentinel_receipt_sha256':sha256_obj(sen),
            'stable_void_receipt_sha256':sha256_obj(sta),
            'planned_real_model_calls':50,
            'observed_preflight_calls':2,
            'observed_sentinel_calls':18,
            'observed_stable_void_calls':30,
            'valid_live_n':0,
            'store_verify_ok':True,
            'automatic_retry':False,
            'replacement_cases':0,
            'replacement_models':0,
            'execution_authority':'NONE',
            'can_execute':False,
          }
          att={**body,'attestation_sha256':sha256_obj(body)}
          json.dump(att,open('adjudication/operator_attestation_core.json','w'),indent=2,sort_keys=True)
          PY

      - name: Qualify existing R13 R1 evidence only
        shell: bash
        run: |
          set -euo pipefail
          PROTOCOL_SHA="$(python -c "import json; print(json.load(open('adjudication/preflight_core.json'))['protocol_manifest_sha256'])")"
          sct-r13 --db adjudication/r13.sqlite qualify \
            --model-manifest "$MODEL_MANIFEST" \
            --preflight-receipt adjudication/preflight_core.json \
            --sentinel-receipt adjudication/sentinel_core.json \
            --stable-void-receipt adjudication/stable_void_core.json \
            --operator-attestation adjudication/operator_attestation_core.json \
            --source-sha "$SOURCE_SHA" \
            --source-tree-sha "$SOURCE_TREE" \
            > adjudication/qualification.json
          sct-r13 --db adjudication/r13.sqlite status > adjudication/status_final.json

          python - <<'PY'
          import json
          q=json.load(open('adjudication/qualification.json'))
          s=json.load(open('adjudication/status_final.json'))
          assert q['qualification']['scientific_pre_case_gate_pass'] is True
          assert q['qualification']['case_001_authorized'] is False
          assert q['qualification']['valid_live_n']==0
          assert q['qualification']['can_execute'] is False
          assert q['qualification']['execution_authority']=='NONE'
          assert s['r13']['scientific_pass_recorded'] is True
          assert s['r13']['owner_enrollment_authorization_recorded'] is False
          assert s['r13']['live_enrollment_allowed'] is False
          assert s['r13']['execution_authority']=='NONE'
          assert s['attempt']['terminal_failure_recorded'] is False
          assert s['attempt']['valid_live_n']==0
          print('R13_R1_EXISTING_EVIDENCE_QUALIFIED_PASS')
          PY

      - name: Write adjudication SHA-256 manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('adjudication')
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.name!='SHA256SUMS.json':
                  rows.append({'path':str(p.relative_to(root)),'size_bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (root/'SHA256SUMS.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          PY

      - name: Upload offline adjudication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SCT_R13_R1_OFFLINE_ADJUDICATION_${{ github.run_id }}
          path: adjudication
          if-no-files-found: error
          retention-days: 90
