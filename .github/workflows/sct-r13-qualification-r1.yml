name: sct-r13-qualification-r1-monitor

on:
  pull_request:
    branches:
      - agent/sct-r13-precase-qualification

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      TARGET_SHA: 13679fce87942c4647879a99a9c7ce831ed67c34
      TARGET_WORKFLOW: sct-r13-qualification-r1
    steps:
      - name: Wait for immutable R13 R1 push run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=""
          for i in $(seq 1 120); do
            payload="$(gh api -X GET repos/${{ github.repository }}/actions/runs -f head_sha="$TARGET_SHA" -f event=push -f per_page=20)"
            RUN_ID="$(python -c 'import json,sys,os; d=json.load(sys.stdin); name=os.environ["TARGET_WORKFLOW"]; xs=[r for r in d.get("workflow_runs",[]) if r.get("name")==name]; print(xs[0]["id"] if xs else "")' <<<"$payload")"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "immutable qualification push run not found" >&2
            exit 20
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "immutable_run_id=$RUN_ID"

          for i in $(seq 1 540); do
            run="$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID)"
            status="$(python -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$run")"
            conclusion="$(python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<<"$run")"
            echo "status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              echo "$run" > immutable_run.json
              echo "QUALIFICATION_CONCLUSION=$conclusion" >> "$GITHUB_ENV"
              break
            fi
            sleep 10
          done
          test -f immutable_run.json

      - name: Print immutable run jobs and artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RUN_ID:-}" ]; then exit 0; fi
          gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs > immutable_jobs.json
          gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts > immutable_artifacts.json
          python - <<'PY'
          import json
          jobs=json.load(open('immutable_jobs.json')).get('jobs',[])
          arts=json.load(open('immutable_artifacts.json')).get('artifacts',[])
          print('JOBS')
          for j in jobs:
              print(j['id'], j['name'], j['status'], j.get('conclusion'))
              for s in j.get('steps',[]):
                  print(' ',s['number'],s['name'],s['status'],s.get('conclusion'))
          print('ARTIFACTS')
          for a in arts:
              print(a['id'],a['name'],a.get('size_in_bytes'),a.get('expired'))
          PY

      - name: Mirror immutable conclusion
        if: always()
        shell: bash
        run: |
          if [ "${QUALIFICATION_CONCLUSION:-}" = "success" ]; then exit 0; fi
          echo "Immutable SCT R13 R1 conclusion: ${QUALIFICATION_CONCLUSION:-UNKNOWN}" >&2
          exit 1
