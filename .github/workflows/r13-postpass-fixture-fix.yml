name: r13-postpass-fixture-fix

on:
  pull_request:
    branches:
      - agent/sct-r13-precase-qualification
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    # Engineering fixture correction only; no model/runtime invocation.
    if: github.head_ref == 'agent/sct-r13-postpass-case001-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sct-r13-postpass-case001-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply fixture-only correction
        run: python tools/r13_postpass_fix_prequal_fixture.py

      - name: Prove affected and post-pass tests
        run: |
          python -m pip install -e . pytest
          pytest -q \
            tests/test_sct_r13_pre_case_qualification.py \
            tests/test_sct_r13_hf_local_and_baseline.py \
            tests/test_sct_r13_live_wiring.py \
            tests/test_sct_r13_terminal_attempt.py \
            tests/test_sct_r13_postpass_hardening.py

      - name: Commit verified fixture only
        run: |
          git rm .github/workflows/r13-postpass-fixture-fix.yml tools/r13_postpass_fix_prequal_fixture.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_sct_r13_pre_case_qualification.py
          git diff --cached --check
          git commit -m "test: bind R13 baseline fixture to frozen policy hashes"
          git push origin HEAD:agent/sct-r13-postpass-case001-hardening
