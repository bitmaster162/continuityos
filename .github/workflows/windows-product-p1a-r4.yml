name: windows-product-p1a-r4

on:
  pull_request:
    paths:
      - "continuityos/windows_product_transaction.py"
      - "native/windows/sovereign_twin_start.c"
      - "tests/test_windows_product_transaction.py"
      - "tests/fixtures/windows/sovereign_twin_binding_probe.c"
      - ".github/workflows/windows-product-p1a-r4.yml"

permissions:
  contents: read

concurrency:
  group: windows-product-p1a-r4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  r4-contract:
    name: win-x64 / strict pointer + serve binding
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run R4 transaction regression suite
        env:
          PYTHONUTF8: "1"
          CONTINUITYOS_SILENCE_EMBED_WARN: "1"
        run: |
          python -m pip install pytest==9.1.1
          python -W error::SyntaxWarning -m pytest -q tests/test_windows_product_transaction.py tests/test_windows_relative_launcher_contract.py

      - name: Compile stable starter and serve-binding probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe not found' }
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vs) { throw 'Visual C++ toolchain not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) { throw 'vcvars64.bat not found' }

          $out = Join-Path $env:RUNNER_TEMP 'p1a-r4-native'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $starter = Join-Path $out 'SovereignTwin-Start.exe'
          $probe = Join-Path $out 'sovereign-twin.exe'
          $starterSrc = Join-Path $env:GITHUB_WORKSPACE 'native\windows\sovereign_twin_start.c'
          $probeSrc = Join-Path $env:GITHUB_WORKSPACE 'tests\fixtures\windows\sovereign_twin_binding_probe.c'
          $bat = Join-Path $env:RUNNER_TEMP 'p1a-r4-build-native.cmd'

          @"
          @echo off
          call "$vcvars"
          if errorlevel 1 exit /b %errorlevel%
          cl.exe /nologo /W4 /WX /O2 /Fe:"$starter" "$starterSrc" shell32.lib
          if errorlevel 1 exit /b %errorlevel%
          cl.exe /nologo /W4 /WX /O2 /Fe:"$probe" "$probeSrc"
          if errorlevel 1 exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $bat -Encoding ascii

          & cmd.exe /d /c $bat
          if ($LASTEXITCODE -ne 0) { throw "native compile failed rc=$LASTEXITCODE" }
          "P1A_R4_STARTER=$starter" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "P1A_R4_PROBE=$probe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove serve child receives exact pointer bindings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $product = Join-Path $env:RUNNER_TEMP 'p1a-r4-product'
          $runtime = Join-Path $env:RUNNER_TEMP 'p1a-r4-runtime'
          $scripts = Join-Path $runtime 'Scripts'
          New-Item -ItemType Directory -Path $product -Force | Out-Null
          New-Item -ItemType Directory -Path $scripts -Force | Out-Null

          $starter = Join-Path $product 'SovereignTwin-Start.exe'
          Copy-Item -LiteralPath $env:P1A_R4_STARTER -Destination $starter
          $twin = Join-Path $scripts 'sovereign-twin.exe'
          Copy-Item -LiteralPath $env:P1A_R4_PROBE -Destination $twin
          $py = Join-Path $runtime 'python.exe'
          [IO.File]::WriteAllBytes($py, [byte[]](0x4d, 0x5a))

          $db = Join-Path $env:RUNNER_TEMP 'p1a-r4-memory.db'
          [IO.File]::WriteAllBytes($db, [byte[]](0x53, 0x51, 0x4c))
          $manifest = Join-Path $env:RUNNER_TEMP 'p1a-r4-memory.manifest.json'
          '{}' | Set-Content -LiteralPath $manifest -Encoding utf8
          $queue = Join-Path $env:RUNNER_TEMP 'p1a-r4-admissions.jsonl'

          $fast = 'fast-r4-sentinel'
          $deep = 'deep-r4-sentinel'
          $embed = 'embedding-r4-sentinel'
          $llm = 'http://127.0.0.1:4321'
          $ui = 'http://127.0.0.1:9876'
          $now = '2026-08-29T00:00:00Z'
          $pointer = [ordered]@{
            schema = 'sovereign-twin.windows-runtime-source/v3'
            repository = 'bitmaster162/continuityos'
            source_sha = '${{ github.event.pull_request.head.sha }}'
            installed_at_utc = $now
            python = $py
            twin_executable = $twin
            memory_db = $db
            admission_queue = $queue
            llm_server = $llm
            ui = $ui
            fast_model = $fast
            deep_model = $deep
            embedding_model = $embed
            execution_authority = 'NONE'
            can_execute = $false
            memory_activated_at_utc = $now
            memory_manifest = $manifest
            memory_embedding_dimension = 768
          }
          $pointer | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $product 'runtime-source.json') -Encoding utf8

          $output = & $starter --serve 2>&1 | Out-String
          $rc = $LASTEXITCODE
          if ($rc -ne 0) { throw "serve binding probe failed rc=$rc output=$output" }

          function Require-Line([string]$line) {
            if ($output -notmatch "(?m)^$([Regex]::Escape($line))`r?$") {
              throw "missing exact child binding '$line' in output: $output"
            }
          }

          Require-Line "FAST=$fast"
          Require-Line "DEEP=$deep"
          Require-Line 'ARG1=--db'
          Require-Line "ARG2=$db"
          Require-Line 'ARG3=--base-url'
          Require-Line "ARG4=$llm"
          Require-Line 'ARG5=--admission-queue'
          Require-Line "ARG6=$queue"
          Require-Line 'ARG7=--embedding-model'
          Require-Line "ARG8=$embed"
          Require-Line 'ARG9=serve'
          Require-Line 'ARG10=--host'
          Require-Line 'ARG11=127.0.0.1'
          Require-Line 'ARG12=--port'
          Require-Line 'ARG13=9876'

      - name: Emit R4 validation summary
        shell: pwsh
        run: |
          $summary = [ordered]@{
            schema = 'sovereign-twin.p1a-r4-validation/v1'
            head_sha = '${{ github.event.pull_request.head.sha }}'
            strict_v3_python_contract = 'PASS'
            manifest_semantic_binding = 'PASS'
            physical_vector_width_binding = 'PASS'
            native_starter_compile = 'PASS'
            serve_fast_deep_env_binding = 'PASS'
            serve_base_url_argument_binding = 'PASS'
            serve_embedding_argument_binding = 'PASS'
            execution_authority = 'NONE'
            can_execute = $false
            activation_performed = $false
            merge_performed = $false
          }
          $summary | ConvertTo-Json -Depth 8 | Out-Host
