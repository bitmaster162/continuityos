name: windows-product-p1b

on:
  pull_request:
    paths:
      - "packaging/windows/SovereignTwin.iss"
      - "tests/test_windows_inno_contract.py"
      - ".github/workflows/windows-product-p1b.yml"
      - "continuityos/windows_product_transaction.py"
      - "tools/build_windows_runtime.py"
      - "native/windows/**"

permissions:
  contents: read

concurrency:
  group: windows-product-p1b-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: win-x64 / Inno staging shell
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up build Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install bounded test and build tooling
        run: python -m pip install pytest==9.1.1 build==1.5.0

      - name: Run P1B staging contract tests
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q tests/test_windows_inno_contract.py

      - name: Build exact ContinuityOS wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wheelhouse = Join-Path $env:RUNNER_TEMP 'p1b-wheelhouse'
          New-Item -ItemType Directory -Path $wheelhouse -Force | Out-Null
          python -m build --wheel --outdir $wheelhouse
          if ($LASTEXITCODE -ne 0) { throw 'wheel build failed' }
          $wheels = @(Get-ChildItem -LiteralPath $wheelhouse -Filter '*.whl')
          if ($wheels.Count -ne 1) { throw "expected exactly one wheel, found $($wheels.Count)" }
          "P1B_WHEEL=$($wheels[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile P1A native launcher and stable starter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe not found' }
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vs) { throw 'Visual C++ toolchain not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) { throw 'vcvars64.bat not found' }

          $nativeOut = Join-Path $env:RUNNER_TEMP 'p1b-native'
          New-Item -ItemType Directory -Path $nativeOut -Force | Out-Null
          $launcher = Join-Path $nativeOut 'sovereign-twin.exe'
          $starter = Join-Path $nativeOut 'SovereignTwin-Start.exe'
          $launcherSrc = Join-Path $env:GITHUB_WORKSPACE 'native\windows\sovereign_twin_launcher.c'
          $starterSrc = Join-Path $env:GITHUB_WORKSPACE 'native\windows\sovereign_twin_start.c'
          $bat = Join-Path $env:RUNNER_TEMP 'p1b-build-native.cmd'

          @"
          @echo off
          call "$vcvars"
          if errorlevel 1 exit /b %errorlevel%
          cl.exe /nologo /W4 /WX /O2 /Fe:"$launcher" "$launcherSrc" shell32.lib
          if errorlevel 1 exit /b %errorlevel%
          cl.exe /nologo /W4 /WX /O2 /Fe:"$starter" "$starterSrc" shell32.lib
          if errorlevel 1 exit /b %errorlevel%
          "@ | Set-Content -LiteralPath $bat -Encoding ascii

          & cmd.exe /d /c $bat
          if ($LASTEXITCODE -ne 0) { throw "native compile failed rc=$LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $launcher)) { throw 'launcher output missing' }
          if (-not (Test-Path -LiteralPath $starter)) { throw 'stable starter output missing' }
          "P1B_LAUNCHER=$launcher" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "P1B_STARTER=$starter" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download exact CPython 3.11.9 embeddable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'python-3.11.9-embed-amd64.zip'
          $pyroot = Join-Path $env:RUNNER_TEMP 'python-3.11.9-embed-amd64'
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile $zip
          New-Item -ItemType Directory -Path $pyroot -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $pyroot -Force
          if (-not (Test-Path -LiteralPath (Join-Path $pyroot 'python.exe'))) { throw 'embedded python.exe missing' }
          if (-not (Test-Path -LiteralPath (Join-Path $pyroot 'python311._pth'))) { throw 'embedded python311._pth missing' }
          "P1B_PYROOT=$pyroot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build immutable P1A runtime payload for installer input
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'p1b-runtimes'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          python -m tools.build_windows_runtime `
            --python-runtime $env:P1B_PYROOT `
            --wheel $env:P1B_WHEEL `
            --launcher $env:P1B_LAUNCHER `
            --output-root $out `
            --source-sha '${{ github.event.pull_request.head.sha }}' `
            --architecture win-x64 `
            --embedding-dimension 768
          if ($LASTEXITCODE -ne 0) { throw 'runtime builder failed' }
          $runtimes = @(Get-ChildItem -LiteralPath $out -Directory | Where-Object { $_.Name -notlike '.p1a-prep-*' })
          if ($runtimes.Count -ne 1) { throw "expected exactly one runtime output, found $($runtimes.Count)" }
          $runtime = $runtimes[0]
          "P1B_RUNTIME=$($runtime.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "P1B_RUNTIME_BUILD_ID=$($runtime.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Acquire and verify exact Inno Setup 7.1.0 x64 compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'inno-download'
          $innoRoot = Join-Path $env:RUNNER_TEMP 'inno-7.1.0-x64-portable'
          $innoLog = Join-Path $env:RUNNER_TEMP 'inno-7.1.0-portable-install.log'
          New-Item -ItemType Directory -Path $download -Force | Out-Null

          gh release download is-7_1_0 --repo jrsoftware/issrc --pattern 'innosetup-7.1.0-x64.exe' --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'failed to download exact Inno Setup 7.1.0 x64 release asset' }
          $asset = Join-Path $download 'innosetup-7.1.0-x64.exe'
          if (-not (Test-Path -LiteralPath $asset)) { throw 'Inno Setup release asset missing after download' }

          Push-Location $download
          try {
            gh release verify-asset 'innosetup-7.1.0-x64.exe' --repo jrsoftware/issrc
            if ($LASTEXITCODE -ne 0) { throw 'GitHub release attestation verification failed for Inno Setup' }
          } finally {
            Pop-Location
          }

          $sig = Get-AuthenticodeSignature -LiteralPath $asset
          if ($sig.Status -ne 'Valid') { throw "Inno Setup Authenticode status is $($sig.Status), expected Valid" }
          if ($null -eq $sig.SignerCertificate -or $sig.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw "unexpected Inno Setup signer: $($sig.SignerCertificate.Subject)"
          }

          $installerArgs = @(
            '/PORTABLE=1',
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            '/CURRENTUSER',
            ('/DIR="' + $innoRoot + '"'),
            ('/LOG="' + $innoLog + '"')
          )
          $proc = Start-Process -FilePath $asset -ArgumentList $installerArgs -PassThru -Wait -WindowStyle Hidden
          if ($proc.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $innoLog) { Get-Content -LiteralPath $innoLog | Out-Host }
            throw "Inno Setup portable compiler extraction failed rc=$($proc.ExitCode)"
          }

          $iscc = Get-ChildItem -LiteralPath $innoRoot -Filter 'ISCC.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            if (Test-Path -LiteralPath $innoLog) { Get-Content -LiteralPath $innoLog | Out-Host }
            throw 'ISCC.exe not found after verified portable compiler extraction'
          }

          $versionText = (& $iscc.FullName --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $versionText -notmatch '7\.1\.0') {
            throw "unexpected ISCC version: $versionText"
          }
          "P1B_ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile unsigned candidate and baseline same-app setups
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'packaging\windows\SovereignTwin.iss'

          $candidateOut = Join-Path $env:RUNNER_TEMP 'p1b-setup-candidate'
          New-Item -ItemType Directory -Path $candidateOut -Force | Out-Null
          & $env:P1B_ISCC `
            '--no-signing' `
            "--define=RuntimeRoot=$env:P1B_RUNTIME" `
            "--define=RuntimeBuildId=$env:P1B_RUNTIME_BUILD_ID" `
            "--define=StableStarter=$env:P1B_STARTER" `
            '--define=ProductVersion=0.1.0-p1b-r3' `
            "--define=SourceSha=${{ github.event.pull_request.head.sha }}" `
            "--define=OutputDir=$candidateOut" `
            $script
          if ($LASTEXITCODE -ne 0) { throw "candidate P1B Inno compile failed rc=$LASTEXITCODE" }
          $candidate = @(Get-ChildItem -LiteralPath $candidateOut -Filter 'SovereignTwin-Setup-*-win-x64.exe' -File)
          if ($candidate.Count -ne 1) { throw "expected one candidate setup, found $($candidate.Count)" }

          $baselineRuntime = Join-Path $env:RUNNER_TEMP 'p1b-baseline-runtime'
          New-Item -ItemType Directory -Path $baselineRuntime -Force | Out-Null
          'BASELINE_RUNTIME_OWNED_BY_SAME_APP' |
            Set-Content -LiteralPath (Join-Path $baselineRuntime 'baseline-runtime-sentinel.txt') -Encoding ascii
          $baselineStarter = Join-Path $env:RUNNER_TEMP 'p1b-baseline-starter.exe'
          Copy-Item -LiteralPath "$env:SystemRoot\System32\cmd.exe" -Destination $baselineStarter -Force

          $baselineOut = Join-Path $env:RUNNER_TEMP 'p1b-setup-baseline'
          New-Item -ItemType Directory -Path $baselineOut -Force | Out-Null
          & $env:P1B_ISCC `
            '--no-signing' `
            "--define=RuntimeRoot=$baselineRuntime" `
            '--define=RuntimeBuildId=baseline-p1b-r3' `
            "--define=StableStarter=$baselineStarter" `
            '--define=ProductVersion=0.0.1-p1b-baseline' `
            '--define=SourceSha=0000000000000000000000000000000000000001' `
            "--define=OutputDir=$baselineOut" `
            $script
          if ($LASTEXITCODE -ne 0) { throw "baseline P1B Inno compile failed rc=$LASTEXITCODE" }
          $baseline = @(Get-ChildItem -LiteralPath $baselineOut -Filter 'SovereignTwin-Setup-*-win-x64.exe' -File)
          if ($baseline.Count -ne 1) { throw "expected one baseline setup, found $($baseline.Count)" }

          "P1B_SETUP=$($candidate[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "P1B_BASELINE_SETUP=$($baseline[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "P1B_BASELINE_STARTER=$baselineStarter" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Fresh install proves stable ARP identity and staging-only state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-SovereignTwinArpEntries {
            $root = 'Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Uninstall'
            if (-not (Test-Path -LiteralPath $root)) { return @() }
            return @(
              Get-ChildItem -LiteralPath $root -ErrorAction Stop |
                ForEach-Object {
                  $props = Get-ItemProperty -LiteralPath $_.PSPath -ErrorAction Stop
                  if ([string]$props.DisplayName -eq 'Sovereign Twin') {
                    [pscustomobject]@{
                      Key = $_.PSChildName
                      Path = $_.PSPath
                      Props = $props
                    }
                  }
                }
            )
          }

          function Get-UninstallerPath([string]$Command) {
            if ($Command -match '^\s*"([^"]+)"') { return $Matches[1] }
            if ($Command -match '^\s*(.+?\.exe)(?:\s|$)') { return $Matches[1].Trim('"') }
            throw "unable to parse uninstall command: $Command"
          }

          $startupShortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Startup\Sovereign Twin UI.lnk'
          $menuShortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Sovereign Twin\Sovereign Twin.lnk'
          Remove-Item -LiteralPath $startupShortcut -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $menuShortcut -Force -ErrorAction SilentlyContinue
          if ((Get-SovereignTwinArpEntries).Count -ne 0) { throw 'pre-existing Sovereign Twin ARP entry on clean runner' }

          $freshRoot = Join-Path $env:RUNNER_TEMP 'p1b fresh install with spaces'
          $installLog = Join-Path $env:RUNNER_TEMP 'p1b-fresh-install.log'
          $pointer = Join-Path $freshRoot 'runtime-source.json'
          $memoryRoot = Join-Path $HOME '.continuityos'
          $memorySentinel = Join-Path $memoryRoot 'p1b-installer-no-touch.txt'
          New-Item -ItemType Directory -Path $memoryRoot -Force | Out-Null
          'P1B_INSTALLER_MUST_NOT_TOUCH_MEMORY' | Set-Content -LiteralPath $memorySentinel -Encoding ascii
          $memoryHashBefore = (Get-FileHash -LiteralPath $memorySentinel -Algorithm SHA256).Hash

          $oldPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $args = @(
              '/VERYSILENT',
              '/SUPPRESSMSGBOXES',
              '/NORESTART',
              '/SP-',
              ('/DIR="' + $freshRoot + '"'),
              ('/LOG="' + $installLog + '"')
            )
            $proc = Start-Process -FilePath $env:P1B_SETUP -ArgumentList $args -PassThru -Wait -WindowStyle Hidden
            if ($proc.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $installLog) { Get-Content -LiteralPath $installLog | Out-Host }
              throw "fresh P1B setup failed rc=$($proc.ExitCode)"
            }
          } finally {
            $env:PATH = $oldPath
          }

          if (Test-Path -LiteralPath $pointer) { throw 'fresh install created runtime-source.json' }
          $installedRuntime = Join-Path (Join-Path $freshRoot 'runtimes') $env:P1B_RUNTIME_BUILD_ID
          $installedPy = Join-Path $installedRuntime 'python.exe'
          $installedStarter = Join-Path $freshRoot 'SovereignTwin-Start.exe'
          if (-not (Test-Path -LiteralPath $installedPy)) { throw 'installed immutable runtime missing python.exe' }
          if (-not (Test-Path -LiteralPath $installedStarter)) { throw 'installed stable starter missing' }
          if ((Get-FileHash $installedStarter -Algorithm SHA256).Hash -ne (Get-FileHash $env:P1B_STARTER -Algorithm SHA256).Hash) {
            throw 'fresh installed starter hash differs from compiled input'
          }

          $stageOut = & $installedPy -B -I -m continuityos.windows_product_transaction stage-validate `
            --runtime-root $installedRuntime --pointer $pointer 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "installed runtime stage validation failed: $stageOut" }
          $stage = $stageOut | ConvertFrom-Json
          if (-not $stage.ok -or $stage.live.present) { throw 'fresh installed runtime did not validate with absent live pointer' }
          if ($stage.execution_authority -ne 'NONE' -or [bool]$stage.can_execute) { throw 'installed runtime authority boundary changed' }

          if (-not (Test-Path -LiteralPath $startupShortcut)) { throw "per-user Startup shortcut missing: $startupShortcut" }
          $shell = New-Object -ComObject WScript.Shell
          $startupLink = $shell.CreateShortcut($startupShortcut)
          if (-not [System.StringComparer]::OrdinalIgnoreCase.Equals([string]$startupLink.TargetPath, $installedStarter)) {
            throw "Startup shortcut target mismatch: $($startupLink.TargetPath)"
          }
          if ([string]$startupLink.Arguments -ne '--serve') { throw "Startup shortcut arguments mismatch: $($startupLink.Arguments)" }
          if (-not [System.StringComparer]::OrdinalIgnoreCase.Equals([string]$startupLink.WorkingDirectory, $freshRoot)) {
            throw "Startup shortcut working directory mismatch: $($startupLink.WorkingDirectory)"
          }

          if (-not (Test-Path -LiteralPath $menuShortcut)) { throw "Start Menu shortcut missing: $menuShortcut" }
          $menuLink = $shell.CreateShortcut($menuShortcut)
          if (-not [System.StringComparer]::OrdinalIgnoreCase.Equals([string]$menuLink.TargetPath, $installedStarter)) {
            throw "Start Menu shortcut target mismatch: $($menuLink.TargetPath)"
          }
          if ([string]$menuLink.Arguments -ne '--open') { throw "Start Menu shortcut arguments mismatch: $($menuLink.Arguments)" }

          $arp = @(Get-SovereignTwinArpEntries)
          if ($arp.Count -ne 1) { throw "fresh install expected one Sovereign Twin ARP entry, found $($arp.Count)" }
          if ([string]$arp[0].Props.DisplayVersion -ne '0.1.0-p1b-r3') {
            throw "fresh ARP DisplayVersion mismatch: $($arp[0].Props.DisplayVersion)"
          }
          $uninstallCommand = [string]$arp[0].Props.UninstallString
          $uninstallerPath = Get-UninstallerPath $uninstallCommand
          $expectedUninstallDir = Join-Path $freshRoot 'uninstall'
          if (-not [System.StringComparer]::OrdinalIgnoreCase.Equals((Split-Path -Parent $uninstallerPath), $expectedUninstallDir)) {
            throw "fresh uninstaller is not in stable uninstall directory: $uninstallerPath"
          }
          if ($uninstallCommand -like "*$env:P1B_RUNTIME_BUILD_ID*") {
            throw 'fresh uninstall identity leaked runtime build id'
          }

          if ((Get-FileHash -LiteralPath $memorySentinel -Algorithm SHA256).Hash -ne $memoryHashBefore) {
            throw 'fresh installer mutated .continuityos memory sentinel'
          }

          $unProc = Start-Process -FilePath $uninstallerPath -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -PassThru -Wait -WindowStyle Hidden
          if ($unProc.ExitCode -ne 0) { throw "fresh uninstall failed rc=$($unProc.ExitCode)" }
          if ((Get-SovereignTwinArpEntries).Count -ne 0) { throw 'fresh ARP entry remained after uninstall' }
          if (Test-Path -LiteralPath $startupShortcut) { throw 'fresh installer-owned Startup shortcut remained after uninstall' }
          if ((Get-FileHash -LiteralPath $memorySentinel -Algorithm SHA256).Hash -ne $memoryHashBefore) {
            throw 'fresh uninstall mutated .continuityos memory sentinel'
          }

          "P1B_MEMORY_SENTINEL=$memorySentinel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "P1B_MEMORY_HASH=$memoryHashBefore" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Same-app upgrade preserves binding and unified uninstall owns ARP state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-SovereignTwinArpEntries {
            $root = 'Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Uninstall'
            if (-not (Test-Path -LiteralPath $root)) { return @() }
            return @(
              Get-ChildItem -LiteralPath $root -ErrorAction Stop |
                ForEach-Object {
                  $props = Get-ItemProperty -LiteralPath $_.PSPath -ErrorAction Stop
                  if ([string]$props.DisplayName -eq 'Sovereign Twin') {
                    [pscustomobject]@{
                      Key = $_.PSChildName
                      Path = $_.PSPath
                      Props = $props
                    }
                  }
                }
            )
          }

          function Get-UninstallerPath([string]$Command) {
            if ($Command -match '^\s*"([^"]+)"') { return $Matches[1] }
            if ($Command -match '^\s*(.+?\.exe)(?:\s|$)') { return $Matches[1].Trim('"') }
            throw "unable to parse uninstall command: $Command"
          }

          $startupShortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Startup\Sovereign Twin UI.lnk'
          $menuShortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Sovereign Twin\Sovereign Twin.lnk'
          Remove-Item -LiteralPath $startupShortcut -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $menuShortcut -Force -ErrorAction SilentlyContinue
          if ((Get-SovereignTwinArpEntries).Count -ne 0) { throw 'stale Sovereign Twin ARP entry before same-app upgrade test' }

          $root = Join-Path $env:RUNNER_TEMP 'p1b same app upgrade safety'
          $baselineLog = Join-Path $env:RUNNER_TEMP 'p1b-baseline-install.log'
          $candidateLog = Join-Path $env:RUNNER_TEMP 'p1b-candidate-over-baseline.log'

          $baselineArgs = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            ('/DIR="' + $root + '"'),
            ('/LOG="' + $baselineLog + '"')
          )
          $baselineProc = Start-Process -FilePath $env:P1B_BASELINE_SETUP -ArgumentList $baselineArgs -PassThru -Wait -WindowStyle Hidden
          if ($baselineProc.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $baselineLog) { Get-Content -LiteralPath $baselineLog | Out-Host }
            throw "baseline install failed rc=$($baselineProc.ExitCode)"
          }

          $baselineArp = @(Get-SovereignTwinArpEntries)
          if ($baselineArp.Count -ne 1) { throw "baseline expected one ARP entry, found $($baselineArp.Count)" }
          if ([string]$baselineArp[0].Props.DisplayVersion -ne '0.0.1-p1b-baseline') {
            throw "baseline ARP DisplayVersion mismatch: $($baselineArp[0].Props.DisplayVersion)"
          }
          $baselineArpKey = [string]$baselineArp[0].Key
          $baselineUninstallPath = Get-UninstallerPath ([string]$baselineArp[0].Props.UninstallString)
          $stableUninstallDir = Join-Path $root 'uninstall'
          if (-not [System.StringComparer]::OrdinalIgnoreCase.Equals((Split-Path -Parent $baselineUninstallPath), $stableUninstallDir)) {
            throw "baseline uninstaller is not in stable uninstall directory: $baselineUninstallPath"
          }

          $pointer = Join-Path $root 'runtime-source.json'
          $pointerBytes = '{"p1b":"pre-existing-binding","execution_authority":"NONE","can_execute":false}'
          [System.IO.File]::WriteAllText($pointer, $pointerBytes, [System.Text.UTF8Encoding]::new($false))
          $pointerHash = (Get-FileHash -LiteralPath $pointer -Algorithm SHA256).Hash

          $starter = Join-Path $root 'SovereignTwin-Start.exe'
          $starterHash = (Get-FileHash -LiteralPath $starter -Algorithm SHA256).Hash
          $expectedBaselineStarterHash = (Get-FileHash -LiteralPath $env:P1B_BASELINE_STARTER -Algorithm SHA256).Hash
          if ($starterHash -ne $expectedBaselineStarterHash) { throw 'baseline starter was not installed as expected' }

          $baselineRuntime = Join-Path $root 'runtimes\baseline-p1b-r3'
          $baselineRuntimeSentinel = Join-Path $baselineRuntime 'baseline-runtime-sentinel.txt'
          if (-not (Test-Path -LiteralPath $baselineRuntimeSentinel)) { throw 'baseline runtime sentinel missing' }
          $baselineRuntimeHash = (Get-FileHash -LiteralPath $baselineRuntimeSentinel -Algorithm SHA256).Hash

          if (-not (Test-Path -LiteralPath $startupShortcut)) { throw 'baseline per-user Startup shortcut missing' }
          $shell = New-Object -ComObject WScript.Shell
          $baselineStartupLink = $shell.CreateShortcut($startupShortcut)
          $baselineStartupTarget = [string]$baselineStartupLink.TargetPath
          $baselineStartupArgs = [string]$baselineStartupLink.Arguments
          $baselineStartupWorkDir = [string]$baselineStartupLink.WorkingDirectory
          $baselineStartupHash = (Get-FileHash -LiteralPath $startupShortcut -Algorithm SHA256).Hash

          if (-not (Test-Path -LiteralPath $menuShortcut)) { throw 'baseline Start Menu shortcut missing' }
          $baselineMenuLink = $shell.CreateShortcut($menuShortcut)
          $baselineMenuTarget = [string]$baselineMenuLink.TargetPath
          $baselineMenuHash = (Get-FileHash -LiteralPath $menuShortcut -Algorithm SHA256).Hash

          $candidateArgs = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            ('/DIR="' + $root + '"'),
            ('/LOG="' + $candidateLog + '"')
          )
          $candidateProc = Start-Process -FilePath $env:P1B_SETUP -ArgumentList $candidateArgs -PassThru -Wait -WindowStyle Hidden
          if ($candidateProc.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $candidateLog) { Get-Content -LiteralPath $candidateLog | Out-Host }
            throw "candidate-over-baseline install failed rc=$($candidateProc.ExitCode)"
          }

          $candidateArp = @(Get-SovereignTwinArpEntries)
          if ($candidateArp.Count -ne 1) { throw "same-app upgrade created duplicate ARP entries: $($candidateArp.Count)" }
          if ([string]$candidateArp[0].Key -ne $baselineArpKey) {
            throw "same-app upgrade changed ARP key: $baselineArpKey -> $($candidateArp[0].Key)"
          }
          if ([string]$candidateArp[0].Props.DisplayVersion -ne '0.1.0-p1b-r3') {
            throw "candidate ARP DisplayVersion mismatch: $($candidateArp[0].Props.DisplayVersion)"
          }
          $candidateUninstallCommand = [string]$candidateArp[0].Props.UninstallString
          $candidateUninstallPath = Get-UninstallerPath $candidateUninstallCommand
          if (-not [System.StringComparer]::OrdinalIgnoreCase.Equals((Split-Path -Parent $candidateUninstallPath), $stableUninstallDir)) {
            throw "candidate uninstaller is not in stable uninstall directory: $candidateUninstallPath"
          }
          if ($candidateUninstallCommand -like "*$env:P1B_RUNTIME_BUILD_ID*" -or
              $candidateUninstallCommand -like '*baseline-p1b-r3*') {
            throw 'same-app uninstall identity leaked runtime build id'
          }

          if ((Get-FileHash -LiteralPath $pointer -Algorithm SHA256).Hash -ne $pointerHash) { throw 'candidate install modified existing pointer' }
          if ((Get-FileHash -LiteralPath $starter -Algorithm SHA256).Hash -ne $starterHash) { throw 'candidate install replaced existing stable starter' }
          if ((Get-FileHash -LiteralPath $baselineRuntimeSentinel -Algorithm SHA256).Hash -ne $baselineRuntimeHash) { throw 'candidate install modified baseline runtime' }
          if ((Get-FileHash -LiteralPath $startupShortcut -Algorithm SHA256).Hash -ne $baselineStartupHash) { throw 'candidate install replaced pre-existing Startup shortcut' }
          if ((Get-FileHash -LiteralPath $menuShortcut -Algorithm SHA256).Hash -ne $baselineMenuHash) { throw 'candidate install replaced pre-existing Start Menu shortcut' }

          $candidateStartupLink = $shell.CreateShortcut($startupShortcut)
          if (-not [System.StringComparer]::OrdinalIgnoreCase.Equals([string]$candidateStartupLink.TargetPath, $baselineStartupTarget)) {
            throw 'candidate install changed pre-existing Startup shortcut target'
          }
          if ([string]$candidateStartupLink.Arguments -ne $baselineStartupArgs) {
            throw 'candidate install changed pre-existing Startup shortcut arguments'
          }
          if (-not [System.StringComparer]::OrdinalIgnoreCase.Equals([string]$candidateStartupLink.WorkingDirectory, $baselineStartupWorkDir)) {
            throw 'candidate install changed pre-existing Startup shortcut working directory'
          }
          $candidateMenuLink = $shell.CreateShortcut($menuShortcut)
          if (-not [System.StringComparer]::OrdinalIgnoreCase.Equals([string]$candidateMenuLink.TargetPath, $baselineMenuTarget)) {
            throw 'candidate install changed pre-existing Start Menu shortcut target'
          }

          $candidateRuntime = Join-Path (Join-Path $root 'runtimes') $env:P1B_RUNTIME_BUILD_ID
          if (-not (Test-Path -LiteralPath (Join-Path $candidateRuntime 'python.exe'))) { throw 'candidate runtime was not staged' }

          if ((Get-FileHash -LiteralPath $env:P1B_MEMORY_SENTINEL -Algorithm SHA256).Hash -ne $env:P1B_MEMORY_HASH) {
            throw 'same-app upgrade mutated .continuityos memory sentinel'
          }

          $unProc = Start-Process -FilePath $candidateUninstallPath -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -PassThru -Wait -WindowStyle Hidden
          if ($unProc.ExitCode -ne 0) { throw "same-app uninstall failed rc=$($unProc.ExitCode)" }

          if ((Get-SovereignTwinArpEntries).Count -ne 0) { throw 'same-app ARP entry remained after unified uninstall' }
          if (-not (Test-Path -LiteralPath $pointer)) { throw 'same-app uninstall removed manually pre-existing pointer' }
          if ((Get-FileHash -LiteralPath $pointer -Algorithm SHA256).Hash -ne $pointerHash) { throw 'same-app uninstall modified manually pre-existing pointer' }
          if (Test-Path -LiteralPath $starter) { throw 'same-app uninstall left installer-owned stable starter' }
          if (Test-Path -LiteralPath $baselineRuntime) { throw 'same-app uninstall left baseline installer-owned runtime' }
          if (Test-Path -LiteralPath $candidateRuntime) { throw 'same-app uninstall left candidate installer-owned runtime' }
          if (Test-Path -LiteralPath $startupShortcut) { throw 'same-app uninstall left installer-owned Startup shortcut' }
          if (Test-Path -LiteralPath $menuShortcut) { throw 'same-app uninstall left installer-owned Start Menu shortcut' }
          if ((Get-FileHash -LiteralPath $env:P1B_MEMORY_SENTINEL -Algorithm SHA256).Hash -ne $env:P1B_MEMORY_HASH) {
            throw 'same-app uninstall mutated .continuityos memory sentinel'
          }

          "P1B_PRESERVE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Emit bounded P1B R3 validation summary
        shell: pwsh
        run: |
          @"
          {
            "schema": "sovereign-twin.p1b-windows-ci-validation/v4",
            "os": "windows-latest",
            "architecture": "win-x64",
            "inno_setup": "7.1.0-x64",
            "installer_compile": "PASS_UNSIGNED_TEST_BUILD",
            "system_python_required_by_installer": false,
            "immutable_runtime_stage": "PASS",
            "fresh_runtime_source_present": false,
            "per_user_startup_shortcut": true,
            "startup_target_stable_starter": true,
            "startup_arguments": "--serve",
            "same_app_arp_entry_count_after_upgrade": 1,
            "same_app_arp_key_stable": true,
            "stable_uninstall_directory": true,
            "append_uninstall_log": true,
            "pre_existing_binding_preserved_during_upgrade": true,
            "pre_existing_startup_shortcut_preserved_during_upgrade": true,
            "existing_starter_preserved_during_upgrade": true,
            "existing_runtime_preserved_during_upgrade": true,
            "unified_uninstall_removes_installer_owned_payload": true,
            "manual_runtime_source_preserved_after_uninstall": true,
            "memory_mutated_by_installer": false,
            "pointer_switch_performed": false,
            "activation_performed": false,
            "execution_authority": "NONE",
            "can_execute": false
          }
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Cleanup bounded CI state
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'

          function Get-SovereignTwinArpEntries {
            $root = 'Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Uninstall'
            if (-not (Test-Path -LiteralPath $root)) { return @() }
            return @(
              Get-ChildItem -LiteralPath $root -ErrorAction SilentlyContinue |
                ForEach-Object {
                  $props = Get-ItemProperty -LiteralPath $_.PSPath -ErrorAction SilentlyContinue
                  if ([string]$props.DisplayName -eq 'Sovereign Twin') {
                    [pscustomobject]@{ Props = $props }
                  }
                }
            )
          }

          function Get-UninstallerPath([string]$Command) {
            if ($Command -match '^\s*"([^"]+)"') { return $Matches[1] }
            if ($Command -match '^\s*(.+?\.exe)(?:\s|$)') { return $Matches[1].Trim('"') }
            return $null
          }

          foreach ($entry in @(Get-SovereignTwinArpEntries)) {
            $path = Get-UninstallerPath ([string]$entry.Props.UninstallString)
            if ($path -and (Test-Path -LiteralPath $path)) {
              Start-Process -FilePath $path -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -WindowStyle Hidden -ErrorAction SilentlyContinue | Out-Null
            }
          }

          $startupShortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Startup\Sovereign Twin UI.lnk'
          $menuShortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Sovereign Twin\Sovereign Twin.lnk'
          Remove-Item -LiteralPath $startupShortcut -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $menuShortcut -Force -ErrorAction SilentlyContinue

          foreach ($rootName in @('p1b fresh install with spaces', 'p1b same app upgrade safety')) {
            $root = Join-Path $env:RUNNER_TEMP $rootName
            if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          if ($env:P1B_MEMORY_SENTINEL -and (Test-Path -LiteralPath $env:P1B_MEMORY_SENTINEL)) {
            Remove-Item -LiteralPath $env:P1B_MEMORY_SENTINEL -Force -ErrorAction SilentlyContinue
          }
          exit 0
