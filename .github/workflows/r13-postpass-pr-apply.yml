name: r13-postpass-pr-apply

on:
  pull_request:
    branches:
      - agent/sct-r13-precase-qualification
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/sct-r13-postpass-case001-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sct-r13-postpass-case001-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic code patch
        run: |
          python tools/r13_postpass_apply.py
          python tools/r13_postpass_fix_legacy_test.py

      - name: Run targeted post-pass tests
        run: |
          python -m pip install -e . pytest
          pytest -q tests/test_sct_r13_hf_local_and_baseline.py tests/test_sct_r13_live_wiring.py tests/test_sct_r13_terminal_attempt.py tests/test_sct_r13_postpass_hardening.py

      - name: Commit verified code only
        run: |
          git rm .github/workflows/r13-postpass-apply-once.yml .github/workflows/r13-postpass-pr-apply.yml tools/r13_postpass_apply.py tools/r13_postpass_fix_legacy_test.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sct tests
          git diff --cached --check
          git commit -m "fix: harden R13 post-pass case provenance"
          git push origin HEAD:agent/sct-r13-postpass-case001-hardening
