[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "continuityos"
dynamic = ["version"]
description = "Local-first durable memory and continuity for AI agents: import history, resume work across sessions, connect MCP clients, and preserve explicit governance boundaries."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "ContinuityOS contributors" }]
keywords = ["memory","ai-agents","mcp","semantic-search","vector","rag","llm","continuity"]
dependencies = []          # core is stdlib-only

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
fast = ["fastembed>=0.3"]
st = ["sentence-transformers>=2.2"]
m2v = ["model2vec>=0.3"]
embeddings = ["fastembed>=0.3", "sentence-transformers>=2.2", "model2vec>=0.3"]

# Backward-compatible aliases for older docs/users.
fastembed = ["fastembed>=0.3"]
sentence-transformers = ["sentence-transformers>=2.2"]

dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5"]

[project.scripts]
cos = "continuityos.current_entrypoints:cos_main"
continuity = "continuityos.current_runtime_cli:main"
continuity-work = "continuityos.current_work_cli:main"
continuity-project-update-review = "continuityos.current_project_update_review_cli:main"
continuity-project-update-preflight = "continuityos.current_project_update_preflight_cli:main"
continuity-project-update-materialize-ready = "continuityos.project_update_post_preflight_materializer_cli:main"
continuity-memory-delta = "continuityos.current_memory_delta_cli:main"
continuity-memory-claim-sync-plan = "continuityos.current_claim_sync_cli:main"
continuity-memory-apply-auth-request = "continuityos.current_memory_apply_auth_request_cli:main"
continuity-memory-apply-check = "continuityos.current_memory_apply_check_cli:main"
continuity-memory-apply = "continuityos.operational_memory_apply_cli:main"
continuity-memory-bootstrap = "continuityos.project_memory_bootstrap_cli:main"
continuity-memory-bootstrap-plan = "continuityos.current_bootstrap_plan_cli:main"
continuity-memory-bootstrap-check = "continuityos.current_bootstrap_check_cli:main"
continuity-state = "continuityos.current_entrypoints:state_main"
continuity-memory = "continuityos.current_entrypoints:operational_memory_main"
continuity-context = "continuityos.current_entrypoints:operational_context_main"
continuity-session = "continuityos.current_entrypoints:session_input_main"
sovereign-twin = "continuityos.sovereign_twin_cli:main"

[project.urls]
Homepage = "https://sovereign-arena-site.vercel.app/continuityos"
Source = "https://github.com/bitmaster162/continuityos"

[tool.setuptools.packages.find]
include = ["continuityos*"]
exclude = ["demo*", "bench*", "tests*", "docs*", "examples*", "dist*"]

[tool.setuptools.package-data]
"continuityos.gate.schemas" = ["*.json"]
"continuityos.causal_spine_schemas" = ["*.json"]
"continuityos.operational_context_schemas" = ["*.json"]
"continuityos.session_input_schemas" = ["*.json"]
"continuityos.github_transition_schemas" = ["*.json"]
"continuityos.work_admission_schemas" = ["*.json"]
"continuityos.work_validation_schemas" = ["*.json"]
"continuityos.work_ledger_schemas" = ["*.json"]
"continuityos.github_candidate_review_schemas" = ["*.json"]
"continuityos.control_plane_integration" = ["*.json"]
"continuityos.control_plane_policy" = ["*.json"]
"continuityos.completion_claim_schemas" = ["*.json"]
"continuityos.control_plane_binding_schemas" = ["*.json"]
"continuityos.merge_authorization_schemas" = ["*.json"]
"continuityos.merge_execution_schemas" = ["*.json"]

[tool.setuptools.dynamic]
version = {attr = "continuityos._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
